[project]
name = "fly-saber"
version = "0.1.0"
description = "A connectome-based fruit fly brain that plays 3D rhythm games, with live brain controls."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "jax>=0.4.30",
    "optax>=0.2.3",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "pyyaml>=6",
    "neuprint-python>=0.4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
]

[project.optional-dependencies]
audio = ["librosa>=0.10"]
llm = ["google-genai>=1.0"]
# GPU JAX for HiPerGator (Linux + NVIDIA only): uv sync --extra cuda
cuda = ["jax[cuda12]>=0.4.30"]

[dependency-groups]
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8", "types-PyYAML", "matplotlib>=3.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["brain", "fly_saber", "training", "server"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
files = ["brain", "fly_saber", "training", "server", "scripts", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
