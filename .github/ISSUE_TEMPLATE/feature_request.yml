name: Feature request
description: Suggest a concrete improvement to Fly Saber.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who needs this and what is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired outcome and any alternatives considered.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What should be true when this work is finished?
    validations:
      required: true
