# Brain modes for the demo (owner: Person 1). scripts/web/export_brains.py bundles each one
# (data/bundles/<id>/) and writes frontend/public/data/brains/. A mode without a checkpoint is
# view-only: its wiring can be shown, but it cannot play.
real_subgraph: data/processed/malecns_subgraph
edges_per_block: 60      # strongest connections kept per layer-to-layer block, for drawing
modes:
  - id: real
    label: Real fly brain
    description: The fly's own wiring from the MaleCNS connectome.
    subgraph: data/processed/malecns_subgraph
    checkpoint: checkpoints/real/fast/seed0/bc_950.npz
  - id: shuffled_layers
    label: Shuffled within layers
    description: Same layers and connection counts as the real brain (eye, lamina, medulla, detectors, central brain, motor), but who connects to whom inside each layer pair is random.
    subgraph: data/processed/malecns_subgraph_rewired_layered
    checkpoint: checkpoints/rewired_layered/fast/seed0/bc_1000.npz
  - id: shuffled_signs
    label: Excitation and inhibition shuffled
    description: The real wiring, but which neurons excite and which inhibit is scrambled.
    subgraph: data/processed/malecns_subgraph_sign_shuffled
    checkpoint: checkpoints/sign_shuffled/fast/seed0/bc_1000.npz
  - id: shuffled_free
    label: Shuffled freely
    description: Every neuron keeps its number of connections, but partners are drawn from anywhere, so the eyes wire straight into the motor neurons.
    subgraph: data/processed/malecns_subgraph_rewired
    checkpoint: null
