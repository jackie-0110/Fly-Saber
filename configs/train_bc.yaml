# train_bc.yaml (owner: Person 2). Loaded into a dataclass; no magic numbers in code.
maps_dir: data/maps/normalized
split: train
min_gap_sec: 0.0          # curriculum: thin same-color notes closer than this
window_sec: 10.0          # episode length; a random window of a random map
speed_mps: 7.0            # note speed for every episode; slower than the maps' own
batch_size: 64            # envs per update
learning_rate: 0.001
n_updates: 2000
log_every: 50             # also runs a greedy evaluation rollout
seed: 0
variant: real              # label for checkpoints/{variant}/seed{seed}/
checkpoint_dir: checkpoints
