# server.yaml (owner: Person 2). Brains the live server offers besides the scripted expert.
# Each is listed in /api/brains only when its checkpoint file exists; copy the chosen
# checkpoint (and the subgraph it was trained on) into place, then restart the server.
brains:
  - id: real
    label: Real wiring
    description: The fly's own visual-to-motor connectome, trained to play by imitation.
    checkpoint: checkpoints/serve/real.npz
  - id: rewired
    label: Scrambled wiring
    description: Same neurons and connection counts with partners shuffled, trained the same way.
    checkpoint: checkpoints/serve/rewired.npz
